<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StayXB - Hotel Concierge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--card:#fff;--ink:#14213D;--pri:#14213D;--pri2:#2A3F6B;--acc:#E0A526;--ok:#2E7D5B;--err:#B3412F;--mut:#5d6677;--line:#e4ded0;--sh:0 8px 24px #14213d14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0B1424;--card:#14213D;--ink:#eef2fa;--pri:#5B8DEF;--pri2:#3A66C8;--line:#26365a;--mut:#a9b4cc;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1424;--card:#14213D;--ink:#eef2fa;--pri:#5B8DEF;--pri2:#3A66C8;--line:#26365a;--mut:#a9b4cc;--sh:none}}
body.palms{--acc:#8FA98B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:.2em 0}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{flex:1}.brand h1{font-size:24px;margin:0;color:var(--pri)}.brand h1 span{color:var(--acc)}.brand small{color:var(--mut);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn,.chip,.ib{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:8px 16px;cursor:pointer;transition:transform .15s}
.btn:hover,.chip:hover{transform:translateY(-1px)}
.btn{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border:0;box-shadow:var(--sh)}.btn:disabled{opacity:.5}.chip{margin:6px 6px 0 0;border-color:var(--acc)}
.ib{padding:8px 12px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#hero{max-width:1100px;margin:16px auto 0;padding:20px;border-radius:24px;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff}
#hero h2{font-size:28px;margin:0}#hero p{opacity:.9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.tile{border-radius:16px;overflow:hidden;background:#0003;cursor:pointer}.tile img{width:100%;height:130px;object-fit:cover;display:block}.tl{padding:8px 12px;font-size:14px}
#qa{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 0;max-width:1100px;margin:auto}#qa .chip{white-space:nowrap;margin:0}
.steps{display:flex;gap:6px;padding:10px 18px 0;font-size:13px;color:var(--mut);flex-wrap:wrap;max-width:1100px;margin:auto}.steps b{color:#fff;background:var(--pri);padding:1px 10px;border-radius:99px}
main{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:10px 18px 100px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}.tl{font-size:12px}}
#log{min-height:40vh;display:flex;flex-direction:column;gap:12px}
.m{position:relative;max-width:94%;padding:12px 16px 12px 46px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.m::before{content:'🛎️';position:absolute;left:10px;top:10px;width:28px;height:28px;display:grid;place-items:center;background:var(--bg);border-radius:50%;font-size:15px}
.m.me{align-self:flex-end;background:var(--pri);color:#fff;border:0;padding-left:16px}.m.me::before{display:none}
.rc{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px;background:var(--bg)}
.ph{position:relative;aspect-ratio:3/2;background:linear-gradient(135deg,#d9cdb8,#8FA98B)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.nop{height:100%;display:grid;place-items:center;color:#fff}
.ai,.cnt{position:absolute;bottom:8px;background:#000a;color:#fff;font-size:11px;padding:2px 8px;border-radius:8px}.ai{left:8px}.cnt{right:8px}
.ph .ib{position:absolute;top:40%;background:#fffd;color:#000;padding:8px 12px}.ph .ib:first-of-type{left:6px}.ph .ib:last-of-type{right:6px}
.b{padding:14px}.tag{background:var(--acc);color:#14213D;border-radius:8px;padding:2px 10px;font-size:12px;margin-right:4px}
.board{position:sticky;top:70px;align-self:start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:18px;padding:16px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:3px 0}td:last-child{text-align:right}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:4px 0}
.err{color:var(--err)}.ok{color:var(--ok)}a{color:var(--pri)}
#bar{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#bar input{flex:1;margin:0;border-radius:99px}
#tools,#dash,#my,#acct{position:fixed;inset:0;background:#000a;display:none;overflow:auto;padding:16px;z-index:9}#tools{z-index:11}#tools>div,#dash>div,#my>div,#acct>div{background:var(--card);max-width:700px;margin:auto;padding:16px;border-radius:20px}#dash>div{max-width:1000px}.dt{display:flex;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--bg);border-radius:14px;padding:10px;font-size:13px}.kpi b{font-size:20px;display:block}.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.row i{display:block;height:12px;border-radius:6px;background:var(--pri)}.donut{width:110px;height:110px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle 28px,transparent 98%,#000 100%);mask:radial-gradient(circle 28px,transparent 98%,#000 100%)}.cols{display:flex;align-items:flex-end;gap:4px;height:110px}.cols div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;font-size:10px;text-align:center;min-height:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px}.rm{display:inline-block;padding:6px 8px;border-radius:8px;text-align:center;font-size:12px;color:#fff}.free{background:#2E7D5B}.bk{background:#B3412F}.oc{background:#7a8294}.mt{background:#c47a14}.hd{background:#6b4fb3}[aria-current]{background:var(--pri);color:#fff}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center}#lb img{max-width:95%;max-height:90%}
#voucher{display:none}
@media print{body.pv>*:not(#voucher){display:none!important}body.pv #voucher{display:block;padding:24px;background:repeating-linear-gradient(-30deg,#fff 0 60px,#fbeee3 60px 62px);color:#000}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><h1>Stay<span>XB</span></h1><small>AI hotel concierge · demo</small></div><button class="ib" data-act="mic" id="mic" aria-label="Talk">🎤</button><button class="ib" data-act="voice" id="vt" aria-pressed="false">🔈 off</button><button class="ib" data-act="theme">🌓</button><button class="ib" id="acb" data-act="acct">👤 Sign in</button><button class="ib" data-act="my">🔎 My booking</button><button class="ib" data-act="dash">📊 Manager</button></header>
<section id="hero"></section><nav id="qa"><button class="chip" data-say="What offers do you have?">🎁 Offers</button><button class="chip" data-say="Tell me about the nearby area">📍 Area guide</button><button class="chip" data-say="What are the room categories?">🛏 Rooms</button><button class="chip" data-say="Show vacancy">📅 Vacancy</button><button class="chip" data-act="help">🎧 Support</button></nav><div class="steps" id="steps"></div><div class="steps" id="vs" aria-live="polite"></div>
<main><section><div id="log" aria-live="polite"></div></section><aside class="board" id="board"></aside><small style="grid-column:1/-1;color:var(--mut)">Demo: no real booking or money. Photos are AI-generated samples.</small></main>
<div id="bar"><input id="in" placeholder="Type here, e.g. 2 adults, 3 nights, Palms" aria-label="Message"><button class="btn" id="go">Send</button></div>
<div id="tools"><div><button class="btn" data-act="close">Close</button>
<h2>Manager</h2><div id="mgr"></div>

<h2>Customer database</h2><div id="dbs"></div><button class="btn" data-act="dbload">Refresh</button><h2>Developer</h2><button class="btn" data-act="tests">Run tests</button><div id="tout"></div>
<p><button class="btn" data-act="wipe">Delete my data</button></p></div></div>
<div id="dash"><div><div class="dt"><h2>Manager dashboard</h2><button class="btn" data-act="dclose">Close</button></div><div id="dbody"></div></div></div><div id="acct"><div><button class="btn" data-act="acx">Close</button><h2>Account</h2><div id="abody"></div></div></div><div id="my"><div><button class="btn" data-act="myx">Close</button><h2>Check booking by mobile number</h2><input id="fmob" placeholder="Mobile number" inputmode="numeric"><button class="btn" data-act="find">Show my booking</button><div id="found"></div></div></div><div id="lb" data-act="lbx"><img alt="Room photo"></div><div id="voucher"></div>

const lookCard=(b,c)=>`<div class="bdw rc b"><b>${b.id}</b> <span class="tag">${b.status}</span><br>${hinfo(b.hotel)}<br>Room ${b.rooms.join(', ')} (${b.cat}), ${b.from} to ${b.to} (${nightsOf(b.from,b.to).length} nights)<br>Total ${Rs(b.total)}, paid ${Rs(b.paid)}${b.guest?'<br>Guest: '+esc(b.guest):''}${c&&b.status=='Confirmed'?`<br><button class="chip" data-act="cancel" data-v="${b.id}">Cancel (refund ${Rs(refund(b))})</button>`:''}</div>`;
const aerr=(m,ok)=>{const e=$('#ae');if(e){e.className=ok?'ok':'err';e.textContent=m}};
function acctRender(){const o=$('#abody'),E='<p id="ae" class="err"></p>',I=(id,t,ty)=>`<input id="${id}" type="${ty||'text'}" placeholder="${t}" autocomplete="off">`;
if(!sb){o.innerHTML='<p>Login is not set up yet. Add your Supabase URL and key in CONFIG.</p>';return}
if(AMODE=='recovery'){o.innerHTML='<p><b>Choose a new password</b></p>'+I('rp','New password (8+ characters)','password')+'<button class="btn" data-act="arec">Save password</button>'+E;return}
if(USER){o.innerHTML=`<p><b>${esc(PROFILE?PROFILE.name||'':'')}</b><br>${esc(USER.email)}${PROFILE&&PROFILE.mobile?'<br>'+esc(PROFILE.mobile):''}</p><button class="chip" data-act="aout">Sign out</button><h3>My bookings</h3><div id="mybk">Loading...</div>`;
api('/api/my/bookings').then(L=>$('#mybk').innerHTML=L.length?L.map(b=>lookCard(b,1)).join(''):'<p>No bookings yet.</p>').catch(e=>$('#mybk').textContent=e.message);return}
const tabs='<p><button class="chip" data-act="amode" data-v="in">Sign in</button><button class="chip" data-act="amode" data-v="up">Create account</button><button class="chip" data-act="amode" data-v="forgot">Forgot password</button></p>';
o.innerHTML=tabs+(AMODE=='up'?I('un','Full name')+I('um','Mobile (10 digits)')+I('ue','Email','email')+I('up','Password (8+ characters)','password')+'<button class="btn" data-act="aup">Create account</button>':AMODE=='forgot'?I('fe','Your email','email')+'<button class="btn" data-act="aforgot">Send reset link</button>':I('ie','Email','email')+I('ip','Password','password')+'<button class="btn" data-act="ain">Sign in</button>')+E+'<p><small>You can also book without an account. Guests find bookings with their mobile number.</small></p>'}
if(sb)sb.auth.onAuthStateChange((ev,ses)=>{USER=ses?ses.user:null;if(ev=='PASSWORD_RECOVERY'){AMODE='recovery';ACT.acct()}
setTimeout(async()=>{if(USER){try{PROFILE=await api('/api/me');if(PROFILE.name&&(!S.name||S.name=='there')){S.name=PROFILE.name.split(' ')[0];keep()}}catch(e){}}else PROFILE=null;
$('#acb').textContent=USER?'👤 '+((PROFILE&&PROFILE.name)||'Account').split(' ')[0]:'👤 Sign in'},0)});
function hero(){$('#hero').innerHTML=`<h2>Find your perfect stay</h2><p>Chat or talk to Riya. She checks vacancy, shows rooms and books for you.</p><div class="tiles">${['skyline','palms'].map(h=>`<div class="tile" data-say="${h=='palms'?'Palms':'Skyline'}" role="button" tabindex="0">${img(h+'.Suite',0)}<div class="tl"><b>${HOTELS[h].name}</b><br>${HOTELS[h].loc}</div></div>`).join('')}</div>`}
/* ===== MANAGER DASHBOARD ===== */
let DTAB='ov',DINC=true,DCLOUD=[],MOK=false,VH='skyline',VD='',BQ='',SHEET='';try{SHEET=localStorage.getItem('sxbSheet')||''}catch(e){}
const allB=()=>ADMINB;

const bookDetail=b=>`<div class="bdw rc b"><b>${b.id}</b> <span class="tag">${b.status}</span><br>${hinfo(b.hotel)}<br>Room ${b.rooms.join(', ')} (${b.cat}), ${b.from} to ${b.to} (${nightsOf(b.from,b.to).length} nights)<br>Guest: ${esc(b.guest||'')}${b.ad?', '+b.ad+' adults'+(b.ch?', '+b.ch+' children':''):''}<br>Plan: ${b.plan}. Total ${Rs(b.total)}, paid ${Rs(b.paid)}${b.state=='PAY_AT_HOTEL'?' (pay at hotel)':''}${b.email?'<br>'+esc(b.email):''}`+(b.status=='Confirmed'?`<p>Refund if cancelled now: <b>${Rs(refund(b))}</b></p><button class="btn" data-act="cancel" data-v="${b.id}">Cancel booking</button>`:'')+'</div>';
/* room state for one night: used by the vacancy view */
function rstate(r,d){if(r.status!='active')return['mt','Maintenance'];const F=CONFIG.SOLD;if(r.hotel==F.hotel&&r.cat==F.cat&&d>=F.from&&d<=F.to)return['oc','Sold out (test dates)'];
const b=ADMINB.find(x=>['Pending','Confirmed','Checked-in'].includes(x.status)&&x.hotel==r.hotel&&x.rooms.includes(r.no)&&d>=x.from&&d<x.to);if(b)return['bk','Booked '+b.id+(b.seed?' (demo)':'')];
if(DB.holds.some(k=>k.exp>Date.now()&&k.hotel==r.hotel&&k.rooms.includes(r.no)&&d>=k.from&&d<k.to))return['hd','On hold'];
return hash(CONFIG.SEED+r.hotel+r.no+d)<Math.min(.95,CONFIG.OCC[r.hotel]*([5,6].includes(dow(d))?1.1:1)*CONFIG.CATF[r.cat])?['oc','Occupied (simulated)']:['free','Free']}
const cols=['id','guest','mobile','email','hotel','cat','rooms','from','to','plan','total','paid','status'];
const rowOf=b=>[b.id,b.guest||'',b.mobile,b.email||'',b.hotel,b.cat,b.rooms.join(' '),b.from,b.to,b.plan,b.total,b.paid,b.status];
const csv=()=>[cols.join(',')].concat(allB().map(b=>rowOf(b).map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n');
async function sheetPush(rows){if(!SHEET)return;try{for(const x of rows)await fetch(SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(x)});$('#vs').textContent='Sent to Google Sheet'}catch(e){$('#vs').textContent='Google Sheet is blocked here. Use the CSV export.'}}
async function loadCloud(){DCLOUD=[];if(!cloud)return;try{const[b,c]=await Promise.all(['bookings','customers'].map(n=>cloud.collection(n).get())),cm={};c.docs.forEach(d=>cm[d.id]=d.data());DCLOUD=b.docs.map(d=>{const x=d.data(),u=cm[d.id]||{};return{...x,guest:u.name,mobile:u.mobile||'-',email:u.email}}).filter(x=>x.hotel&&x.rooms)}catch(e){}}
/* manager password: PBKDF2 hash (never the password itself) stored in the admin-only database */
const MG={cfg:null,mode:'load',fails:0,until:0,msg:''};
const pwOK=p=>p.length>=8&&/[a-z]/i.test(p)&&/\d/.test(p);
const b64=u=>btoa(String.fromCharCode(...u)),unb=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb(salt),iterations:100000,hash:'SHA-256'},k,256)))}
async function setPw(email,pw){const salt=b64(crypto.getRandomValues(new Uint8Array(16))),c={email,salt,hash:await hashPw(pw,salt),at:Date.now()};if(!await cloudSet('config','manager',c))return false;MG.cfg=c;return true}
function mg(m){MG.msg=m;const e=$('#pe');if(e)e.textContent=m;return 1}
async function cfgLoad(){await cloudReady;if(!cloud){MG.mode='locked';return}try{const d=await cloud.collection('config').doc('manager').get();MG.cfg=d.exists?d.data():null;if(MG.mode=='load'||MG.mode=='setup'||MG.mode=='login')MG.mode=MG.cfg?'login':'setup'}catch(e){MG.mode='locked';CERR='Could not read the database: '+(e.code||e.message)}}
async function dinit(){MOK=false;if(!USER){MG.msg='Sign in with the manager account first.';return render()}
try{const m=await api('/api/me');if(m.role!='admin'){MG.msg='This account is not a manager account.';return render()}ADMINB=await api('/api/admin/bookings');MOK=true}catch(e){MG.msg=e.message}render()}

function render(){const o=$('#dbody');if(!MOK){o.innerHTML='<p><b>Manager access only.</b> '+esc(MG.msg||'Sign in with the manager account.')+'</p><button class="btn" data-act="acct">Sign in</button>';return}
const T=[['ov','Overview'],['vac','Rooms'],['bk','Bookings'],['exp','Export'],['set','Settings']];
o.innerHTML='<div>'+T.map(t=>`<button class="chip" data-act="dtab" data-v="${t[0]}" ${DTAB==t[0]?'aria-current="page"':''}>${t[1]}</button>`).join('')+`<label><input type="checkbox" id="dinc" ${DINC?'checked':''} style="width:auto;min-height:0"> include demo data</label></div><div id="dpane"></div>`;
$('#dpane').innerHTML=({ov:pOv,vac:pVac,bk:pBk,exp:pExp,set:pSet})[DTAB]()}
function pOv(){const B=allB(),st=k=>B.filter(b=>b.status==k).length,ok=B.filter(b=>b.status!='Cancelled'),rev=ok.reduce((a,b)=>a+b.total,0),can=st('Cancelled'),conf=st('Confirmed'),chk=st('Checked-in'),n=B.length||1;
const grp=(f,v)=>{const m={};ok.forEach(b=>m[f(b)]=(m[f(b)]||0)+v(b));return m};
const bars=(m,f)=>{const mx=Math.max(1,...Object.values(m));return Object.entries(m).map(([k,v])=>`<div class="row"><span style="min-width:90px">${k}</span><i style="width:${v/mx*50}%"></i>${f(v)}</div>`).join('')||'<p>No data yet</p>'};
const a=conf/n*100,a2=a+chk/n*100,days=[...Array(14)].map((_,i)=>{const d=addD(today(),i);return[d,ok.filter(b=>b.from==d).length]}),mx=Math.max(1,...days.map(x=>x[1]));
const occ={};['skyline','palms'].forEach(h=>{const rs=ROOMS.filter(r=>r.hotel==h);occ[HOTELS[h].name]=Math.round(rs.filter(r=>rstate(r,today())[0]!='free').length/rs.length*100)});
return`<div class="kpis">${[['Bookings',B.length],['Confirmed',conf],['Cancelled',can+' ('+Math.round(can/n*100)+'%)'],['Checked-in',chk],['Customers',new Set(B.map(b=>b.mobile)).size],['Revenue',Rs(rev)],['Average stay',(ok.reduce((x,b)=>x+nightsOf(b.from,b.to).length,0)/(ok.length||1)).toFixed(1)+' nights']].map(k=>`<div class="kpi">${k[0]}<b>${k[1]}</b></div>`).join('')}</div>
<h3>Booking status</h3><div class="row"><div class="donut" role="img" aria-label="Status chart" style="background:conic-gradient(#2E7D5B 0 ${a}%,#2A6FDB ${a}% ${a2}%,#B3412F ${a2}% 100%)"></div><div>🟩 Confirmed ${conf}<br>🟦 Checked-in ${chk}<br>🟥 Cancelled ${can}</div></div>
<h3>Revenue by room category</h3>${bars(grp(b=>b.cat,b=>b.total),Rs)}<h3>Bookings by hotel</h3>${bars(grp(b=>HOTELS[b.hotel].name,()=>1),x=>x)}
<h3>Arrivals, next 14 days</h3><div class="cols">${days.map(d=>`<div style="height:${d[1]/mx*100}%" title="${d[0]}: ${d[1]}">${d[1]}</div>`).join('')}</div><h3>Rooms in use today</h3>${bars(occ,x=>x+'%')}`}
function pVac(){const d=VD||today();let h='';for(const c of Object.keys(HOTELS[VH].cats)){const L=ROOMS.filter(r=>r.hotel==VH&&r.cat==c).map(r=>[r,rstate(r,d)]),z={};L.forEach(x=>z[x[1][0]]=(z[x[1][0]]||0)+1);
h+=`<h3>${c} <small>free ${z.free||0}, booked ${z.bk||0}, occupied ${z.oc||0}, hold ${z.hd||0}, maintenance ${z.mt||0}</small></h3><div class="grid">${L.map(x=>`<div class="rm ${x[1][0]}" title="${x[1][1]}">${x[0].no}</div>`).join('')}</div>`}
return`<select id="vh"><option value="skyline" ${VH=='skyline'?'selected':''}>Skyline</option><option value="palms" ${VH=='palms'?'selected':''}>Palms</option></select><input type="date" id="vd" value="${d}"><p><span class="rm free">Free</span> <span class="rm bk">Booked</span> <span class="rm oc">Occupied (sim)</span> <span class="rm hd">Hold</span> <span class="rm mt">Maintenance</span></p>`+h}
const blist=()=>{const q=BQ.toLowerCase();return allB().filter(b=>!q||(b.id+(b.guest||'')+b.mobile).toLowerCase().includes(q)).sort((a,b)=>(b.created||0)-(a.created||0)||a.from.localeCompare(b.from)).slice(0,60)};
const bt=L=>'<tr><td>ID</td><td>Guest</td><td>Mobile</td><td>Room</td><td>Check-in</td><td>Status</td><td>Total</td><td></td></tr>'+L.map(b=>`<tr><td>${b.id}</td><td>${esc(b.guest||'')}</td><td>${esc(b.mobile)}</td><td>${b.hotel=='palms'?'Palms':'Skyline'} ${b.rooms[0]}</td><td>${b.from}</td><td>${b.status}</td><td>${Rs(b.total)}</td><td><button class="chip" data-act="dview" data-v="${b.id}">View</button></td></tr>`).join('');
const pBk=()=>`<input id="qs" placeholder="Search by booking ID, mobile or name" value="${esc(BQ)}"><div style="overflow-x:auto"><table id="bt">${bt(blist())}</table></div><div id="bdet"></div>`;
const pExp=()=>`<p>${allB().length} bookings ready. CSV opens in Excel and Google Sheets.</p><button class="btn" data-act="csvdl">Download CSV</button> <button class="chip" data-act="csvcopy">Copy for Google Sheets</button><h3>Google Sheet (auto-save)</h3>`+(SHEET?'<p class="ok">Sheet connected. New bookings are sent automatically.</p><button class="chip" data-act="sheetsend">Send all bookings now</button><button class="chip" data-act="sheetrm">Disconnect</button>':'<input id="surl" placeholder="Apps Script web app URL (paste once)"><button class="btn" data-act="sheetsave">Connect sheet</button>')+`<p><small>Needs a Google Apps Script web app and only works when you host this file yourself (claude.ai pages cannot call other sites). On claude.ai use the CSV buttons.</small></p><details><summary>Apps Script code</summary><pre>function doPost(e){\n var r=JSON.parse(e.postData.contents);\n SpreadsheetApp.getActiveSheet().appendRow(r);\n return ContentService.createTextOutput('ok');\n}</pre></details><textarea id="csvbox" rows="4" placeholder="CSV text appears here if download is blocked"></textarea>`;
const pSet=()=>'<h3>Tools</h3><button class="btn" data-act="tools">Tests and developer tools</button>';

/* wiring */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a.dataset.v,a);return}
const c=e.target.closest('[data-say]');if(c){send(c.dataset.say);return}if(e.target.matches('.ph img')){$('#lb img').src=e.target.src;$('#lb').style.display='grid'}});
document.addEventListener('change',e=>{if(e.target.matches('[data-date]'))send(e.target.value);if(e.target.matches('#vh,#vd')){VH=$('#vh').value;VD=$('#vd').value||today();render()}if(e.target.id=='dinc'){DINC=e.target.checked;render()}});
document.addEventListener('input',e=>{if(e.target.id=='qs'){BQ=e.target.value;$('#bt').innerHTML=bt(blist())}});
$('#go').onclick=()=>{send($('#in').value);$('#in').value=''};$('#in').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
hero();if(S.hotel)$('#hero').style.display='none';if(!S.nameAsked){bot('Hello! I am Riya, your StayXB concierge (demo). May I know your name?',chips(['Skip']));S.nameAsked=1;keep()}stepper();board();if(S.name)drive();
</script></body></html>
